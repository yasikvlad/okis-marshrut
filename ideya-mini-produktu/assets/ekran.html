<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Мій маршрут</title>
<style>
:root{--bg:#f1e9e1;--card:#fffaf5;--paper:#f8f2ec;--ink:#33281f;--muted:#7d6a5f;--accent:#8a6355;--gold:#c9a27e;--line:#e0d2c5;--chip:#ece0d4;--ok:#4f7a4a;--sh:0 1px 2px rgba(51,40,31,.05),0 10px 30px rgba(51,40,31,.10)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1714;--card:#2a221e;--paper:#251e1a;--ink:#f2e8df;--muted:#b6a396;--accent:#d6aa93;--gold:#d8b48f;--line:#3e332c;--chip:#352b25;--ok:#a8c3a0;--sh:0 1px 2px rgba(0,0,0,.3)}}
:root[data-theme="dark"]{--bg:#1c1714;--card:#2a221e;--paper:#251e1a;--ink:#f2e8df;--muted:#b6a396;--accent:#d6aa93;--gold:#d8b48f;--line:#3e332c;--chip:#352b25;--ok:#a8c3a0;--sh:0 1px 2px rgba(0,0,0,.3)}
*{box-sizing:border-box}html,body{margin:0}
body{overflow-x:hidden;background:var(--bg);color:var(--ink);font:15px/1.6 "Helvetica Neue",Arial,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.serif,h1,h3{font-family:Georgia,"Times New Roman",serif;font-weight:700;line-height:1.08;margin:0}
.px{font-family:"Courier New",monospace;font-weight:700;letter-spacing:.04em}
.wrap{width:100%;max-width:760px;margin:0 auto;padding:14px 14px 34px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;min-width:0}
.badge{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);font-weight:700}
.top h1{font-size:26px;margin-top:2px}
.snd{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:7px 12px;font:600 12px inherit;cursor:pointer;white-space:nowrap}
.steps{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:5px;margin:14px 0 12px}
.stp{min-width:0;background:none;border:0;padding:0;cursor:pointer;text-align:left;color:inherit;font:inherit}
.stp:disabled{cursor:default}
.stp .bar{height:6px;border-radius:99px;background:var(--chip);overflow:hidden}
.stp .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--gold));transition:width .5s}
.stp.done .bar i{width:100%}.stp.on .bar i{width:55%;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.55}}
.stp span{display:block;font-size:10px;color:var(--muted);margin-top:5px;font-weight:600;line-height:1.2;overflow:hidden;text-overflow:ellipsis}
.stp.on span,.stp.done span{color:var(--ink)}.stp.done span:before{content:"✓ ";color:var(--ok)}
.stage{position:relative;border-radius:22px;overflow:hidden;box-shadow:var(--sh);background:#2b2420}
canvas#sc{display:block;width:100%;height:auto;image-rendering:pixelated;image-rendering:crisp-edges}
.cap{position:absolute;left:10px;top:10px;background:rgba(20,15,12,.75);color:#f6e7d8;border-radius:9px;padding:5px 9px;font-size:11px;max-width:72%}
.cap b{color:#ffd59a}
.tm{position:absolute;right:10px;top:10px;background:rgba(20,15,12,.75);color:#f6e7d8;border-radius:9px;padding:5px 9px;font-size:11px}
.coach{display:grid;grid-template-columns:64px 1fr;gap:12px;align-items:end;margin:-34px 10px 0;position:relative;z-index:2}
.coach img{width:64px;height:64px;border-radius:50%;object-fit:cover;border:3px solid var(--card);box-shadow:var(--sh);background:var(--chip)}
.coach.big{grid-template-columns:96px 1fr}.coach.big img{width:96px;height:96px}
.bub{background:var(--card);border:1px solid var(--line);border-radius:18px 18px 18px 4px;padding:12px 14px;box-shadow:var(--sh);min-height:62px}
.who{font-size:11px;font-weight:700;color:var(--accent)}.who small{color:var(--muted);font-weight:500}
.bub p{margin:2px 0 0;font-size:15px}
.caret{display:inline-block;width:2px;height:1em;background:var(--accent);vertical-align:-2px;margin-left:2px;animation:blink .8s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.feed{margin-top:16px;display:grid;gap:8px}
.it{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;display:flex;gap:10px;align-items:flex-start;animation:pop .45s cubic-bezier(.2,1.4,.4,1) both}
.it .ic{font-size:18px;line-height:1.3}.it b{display:block;font-size:14px}.it small{color:var(--muted);font-size:12.5px}
.it.sum{border-color:var(--gold)}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.97)}to{opacity:1;transform:none}}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--sh);animation:pop .5s both}
.card h3{font-size:23px;margin-bottom:8px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px;margin:0}.kv dt{color:var(--muted)}.kv dd{margin:0;font-weight:600}
.plan{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.plan li{display:flex;gap:10px;align-items:center;font-size:14.5px}
.plan b{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--chip);color:var(--accent);flex:none}
.ideas{display:grid;gap:10px}
.idea{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:14px;cursor:pointer;text-align:left;font:inherit;color:inherit;transition:border-color .2s,transform .15s;animation:pop .5s both}
.idea:hover{transform:translateY(-2px)}.idea.rec{border-color:var(--gold)}
.idea.pick{border-color:var(--accent);box-shadow:0 0 0 4px rgba(138,99,85,.2)}
.idea h3{font-size:21px}.idea .m{font-size:12.5px;color:var(--muted);margin:3px 0 8px}
.idea ul{list-style:none;margin:0;padding:0;font-size:13.5px}.idea li{margin:3px 0}
.tag{display:inline-block;font:700 10.5px inherit;border-radius:999px;padding:2px 8px;background:var(--gold);color:#2b211b;margin-left:6px;vertical-align:middle}
.dots{letter-spacing:2px;color:var(--accent)}
.pass{background:linear-gradient(150deg,#2f2621,#4a3a31);color:#f6ece3;border-radius:22px;padding:18px;animation:pop .5s both}
.pass h3{font-size:27px;color:#fff}
.pass .k{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.pass .k div{background:rgba(255,255,255,.07);border-radius:12px;padding:8px 10px;font-size:13px}
.pass .k b{display:block;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:#d8b4a0}
.map{margin-top:12px;font-size:13.5px;line-height:1.9}
.nx{display:inline-block;margin-top:10px;background:#d8b4a0;color:#2b211b;border-radius:12px;padding:9px 14px;font-weight:700;font-size:14px}
.ctrl{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.btn{border:0;border-radius:12px;padding:11px 16px;font:700 14px inherit;cursor:pointer;background:var(--accent);color:#fff}
.btn.g{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.note{font-size:12px;color:var(--muted);margin-top:10px}
#cf{position:fixed;inset:0;pointer-events:none;z-index:50}
@media (max-width:520px){.top h1{font-size:22px}.stp span{font-size:9px}.cap,.tm{font-size:10px}.coach{grid-template-columns:52px 1fr}.coach img{width:52px;height:52px}.coach.big{grid-template-columns:72px 1fr}.coach.big img{width:72px;height:72px}.pass .k{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

  ob('board',150,12); ob('clock',120,10); ob('hang',286,4); ob('shelf',24,30); ob('shelf',60,30);
  ob('plant',4,40); ob('cactus',300,120); ob('sofa',236,128);
  const typing = stage === 1 || stage >= 4;
  fr(typing ? FR.girl[1+Math.floor(tick/10)%2] : FR.girl[0], 140, 90);
  ob('desk',116,112); fr(stage === 1 ? FR.pc[Math.floor(tick/12)%3] : FR.pc[0], 118, 100); ob('coffee',156,110);
  if (stage === 0){ const j = Math.abs(Math.sin(tick/14))*3; fr(FR.res[3],40,60-j); fr(FR.lis[3],244,108-j); fr(FR.ide[2],196,60-j); }
  else {
    if (stage === 2){ walk(FR.res,28,96,46,.6,0); if (tick%120<60){ cx.fillStyle='#fffaf5'; cx.fillRect(42,30,14,11); cx.fillStyle='#8a6355'; cx.fillRect(46,33,5,5); cx.fillRect(50,37,3,2); } }
    else if (stage !== 5) fr(FR.res[3],40,60);
    if (stage === 3) walk(FR.lis,200,280,96,.5,30); else if (stage !== 5) fr(FR.lis[3+Math.floor(tick/30)%2],244,108);
    if (stage === 4){ fr(FR.ide[Math.floor(tick/10)%2],158,40); if (tick%40<20){ cx.fillStyle='#ffd59a'; cx.fillRect(170+(tick%7)*2,22+(tick%5)*2,2,2); } }
    else if (stage !== 5) fr(FR.ide[2],196,60);
    if (stage === 5){ const j = k => Math.abs(Math.sin(tick/8+k))*6; fr(FR.res[3],40,60-j(0)); fr(FR.ide[2],196,60-j(1)); fr(FR.lis[3],244,108-j(2)); for (let i=0;i<14;i++){ cx.fillStyle=['#ffd59a','#d8b4a0','#a8c3a0','#fff'][i%4]; cx.fillRect((i*53+tick*1.3)%W,(i*37+tick*1.7)%WALL,2,2); } }
  }
  if (typing){ cx.fillStyle = 'rgba(255,230,180,.10)'; cx.beginPath(); cx.arc(134,108,26,0,7); cx.fill(); }
  const s = Math.floor((performance.now()-t0)/1000); $('#tm').textContent = String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
  requestAnimationFrame(draw);
}
requestAnimationFrame(draw);

/* ============ ДІАЛОГ І ЗНАХІДКИ ============ */
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let typer = null, timers = [];
function say(txt){ clearInterval(typer); const el = $('#say'); let i = 0; typer = setInterval(() => { i++; el.innerHTML = esc(txt.slice(0,i)) + (i < txt.length ? '<span class="caret"></span>' : ''); if (i%3===0) SND.tick(); if (i >= txt.length) clearInterval(typer); }, 22); }
function later(ms, fn){ timers.push(setTimeout(fn, ms)); }
function add(html, s){ const d = document.createElement('div'); d.innerHTML = html; $('#feed').appendChild(d.firstElementChild); if (s) SND[s](); }
function has(i){ return i === 0 || i === 1 && Object.keys(STATE.expert||{}).length || i === 2 && (STATE.products||[]).length || i === 3 && (STATE.pains||[]).length || i === 4 && (STATE.ideas||[]).length || i === 5 && STATE.pick >= 0; }
function steps(){ $('#steps').innerHTML = L.steps.map((s,i) => `<button class="stp ${i<stage?'done':i===stage?'on':''}" data-i="${i}" ${STATE.demo||i<=STATE.stage?'':'disabled'}><div class="bar"><i></i></div><span>${s}</span></button>`).join(''); }
function go(i, quiet){
  stage = Math.max(0, Math.min(5, i)); timers.forEach(clearTimeout); timers = []; $('#feed').innerHTML = '';
  steps(); $('#cap').innerHTML = L.caps[stage]; say((STATE.say||[])[stage] || ''); $('#coach').classList.toggle('big', stage === 0);
  if (!quiet) SND.step();
  if (stage === 0) later(900, () => add(`<div class="card"><h3>${L.planT}</h3><ol class="plan">${L.plan.map((p,k)=>`<li><b>${k+1}</b>${p}</li>`).join('')}</ol></div>`, 'pop'));
  if (stage === 1 && has(1)) later(1400, () => add(`<div class="card"><h3>${L.expT}</h3><dl class="kv">${Object.entries(STATE.expert).map(([k,v])=>`<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join('')}</dl></div>`, 'pop'));
  if (stage === 2){ (STATE.products||[]).forEach((p,k) => later(900+k*900, () => add(`<div class="it"><span class="ic">🔍</span><div><b>${esc(p[0])}</b><small>${esc(p[1])}</small></div></div>`, 'pop'))); if (STATE.productsSum) later(900+(STATE.products||[]).length*900+400, () => add(`<div class="it sum"><span class="ic">💡</span><div><b>${L.sumT}</b><small>${esc(STATE.productsSum)}</small></div></div>`, 'idea')); }
  if (stage === 3) (STATE.pains||[]).forEach((p,k) => later(900+k*850, () => add(`<div class="it"><span class="ic">💬</span><div><b>${esc(p[0])}</b><small>${esc(p[1])}</small></div></div>`, 'pop')));
  if (stage === 4) later(700, () => add(`<div class="ideas">${(STATE.ideas||[]).map((d,k)=>`<button class="idea ${d.rec?'rec':''} ${STATE.pick===k&&!STATE.demo?'pick':''}" data-k="${k}" style="animation-delay:${k*.25}s"><h3>💡 ${k+1}. ${esc(d.t)}${d.rec?`<span class="tag">${L.recT}</span>`:''}</h3><div class="m">${esc(d.who)} · ${esc(d.f)}</div><ul>${(d.why||[]).map(w=>`<li>✅ ${esc(w)}</li>`).join('')}</ul><div class="m">${L.sure}: <span class="dots">${'●'.repeat(d.s||0)}${'○'.repeat(4-(d.s||0))}</span></div></button>`).join('')}</div>`, 'idea'));
  if (stage === 5 && STATE.pick >= 0){ const d = STATE.ideas[STATE.pick]; later(500, () => { add(`<div class="pass"><h3>${L.passT}</h3><div class="k"><div><b>${L.pI}</b>${esc(d.t)}</div><div><b>${L.pW}</b>${esc(d.who)}</div><div><b>${L.pF}</b>${esc(d.f)}</div><div><b>${L.pY}</b>${L.pYv}</div>${STATE.first?`<div><b>${L.before}</b>${esc(STATE.first)}</div>`:''}</div><div class="map">${L.map.join('<br>')}</div><span class="nx">${L.next}</span></div>`, 'win'); confetti(); }); }
}
$('#steps').addEventListener('click', e => { const b = e.target.closest('.stp'); if (b && !b.disabled){ stop(); go(+b.dataset.i); } });
$('#feed').addEventListener('click', e => { const b = e.target.closest('.idea'); if (!b) return; document.querySelectorAll('.idea').forEach(x => x.classList.toggle('pick', x === b)); const k = +b.dataset.k; SND.idea(); confetti(50);
  if (STATE.demo){ STATE.pick = k; say(L.pickDemo); later(1600, () => go(5)); } else say(L.pickSay(k+1)); });

/* демо-кнопки */
let pt = null;
function stop(){ if (pt){ clearInterval(pt); pt = null; const b = $('#play'); if (b) b.textContent = L.play; } }
if (STATE.demo){
  $('#ctrl').innerHTML = `<button class="btn" id="play">${L.play}</button><button class="btn g" id="nxt">${L.nextB}</button>`;
  $('#nxt').addEventListener('click', () => { stop(); go(stage === 5 ? 0 : stage + 1); });
  $('#play').addEventListener('click', () => { if (pt){ stop(); return; } go(0); $('#play').textContent = L.pause; pt = setInterval(() => { if (stage === 4){ const b = document.querySelector('.idea[data-k="'+(STATE.pick>=0?STATE.pick:1)+'"]'); if (b) b.click(); stop(); return; } go(stage + 1); }, 8000); });
}

/* конфеті */
const cc = $('#cf'), c2 = cc.getContext('2d'); let parts = [];
function rs(){ cc.width = innerWidth; cc.height = innerHeight; } addEventListener('resize', rs); rs();
function confetti(n){ if (matchMedia('(prefers-reduced-motion: reduce)').matches) return; const was = parts.length; for (let i=0;i<(n||140);i++) parts.push({x:innerWidth/2,y:innerHeight*.45,vx:(Math.random()-.5)*14,vy:-Math.random()*13-4,s:Math.random()*6+4,c:['#c9a27e','#8a6355','#e9c7a8','#a8c3a0','#f6d2c4'][i%5],r:Math.random()*6,l:120}); if (!was) loop(); }
function loop(){ c2.clearRect(0,0,cc.width,cc.height); parts.forEach(p => { p.vy += .35; p.x += p.vx; p.y += p.vy; p.r += .2; p.l--; c2.save(); c2.translate(p.x,p.y); c2.rotate(p.r); c2.fillStyle = p.c; c2.fillRect(-p.s/2,-p.s/4,p.s,p.s/2); c2.restore(); }); parts = parts.filter(p => p.l > 0 && p.y < cc.height+20); if (parts.length) requestAnimationFrame(loop); else c2.clearRect(0,0,cc.width,cc.height); }

go(stage, true);
</script>
</body>
